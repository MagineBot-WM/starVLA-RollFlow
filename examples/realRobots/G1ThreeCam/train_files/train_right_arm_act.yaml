run_id: g1_right_arm_pepper_act_bs8_10k
run_root_dir: /home/taizun/cym_ws/train_right_arm_act/models
seed: 42
wandb_entity: null
wandb_project: starVLA_g1_right_arm_act
is_debug: false
version_id: "0.21"

framework:
  name: ACT
  chunk_size: 16
  action_dim: 20
  state_dim: 20
  n_obs_steps: 1
  image_size: [160, 160]
  image_keys: [cam_high_rgb, cam_left_wrist_rgb, cam_right_wrist_rgb]
  pretrained_backbone_weights: null

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    per_device_batch_size: 1
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /home/taizun/cym_ws/train_right_arm_act/datasets
    data_mix: g1_right_arm_pepper
    default_prompt: "pick the red pepper to the pink plate"
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [160, 160]
    video_backend: torchvision_av

trainer:
  max_train_steps: 10000
  num_warmup_steps: 500
  save_interval: 300
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 20
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
